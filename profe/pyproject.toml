[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[project]
name = "profe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Luis Cano Rodríguez", email = "juan.rodriguez@canonical.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pi-agent-json",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.2",
]

[project.scripts]
profe = "profe.cli:main"

[dependency-groups]
analysis = [
    "pairedstats",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.89",
]

[tool.uv.workspace]
members = [
    "packages/pi-agent-json",
    "packages/pairedstats",
]

[tool.uv.sources]
pi-agent-json = { workspace = true }
pairedstats = { workspace = true }

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
select = [
    "F",  # Pyflakes
    "E",  # Pycodestyle
    "W",  # Pycodestyle
    "D",  # Pydocstyle
    "UP",  # pyupgrade
    "I",  # isort
    "PL",  # Pylint
]
ignore = [
    "D203",  # incorrect-blank-line-before-class (prefer D211: no-blank-line-before-class)
    "D213",  # multi-line-summary-second-line (prefer D212: multi-line-summary-first-line)
    "PLR2004",  # magic-value-comparison (heuristic thresholds are everywhere)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D", "PLR2004"]

[tool.ty.analysis]
return-type-inference = "always"
respect-type-ignore-comments = false

[tool.ty.rules]
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
missing-type-argument = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
blanket-ignore-comment = "error"
