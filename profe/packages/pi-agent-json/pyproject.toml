[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pi-agent-json"
version = "0.1.0"
description = "Typed Pydantic models of pi --mode json event streams"
readme = "README.md"
authors = [
    { name = "Juan Luis Cano Rodríguez", email = "juan.rodriguez@canonical.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]
